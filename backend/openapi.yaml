        schema:
          type: boolean
      - in: query
        name: mode_suivi
        schema:
          type: string
          enum:
          - NUMERO_SERIE
          - QUANTITE
        description: |-
          * `QUANTITE` - Quantité simple
          * `NUMERO_SERIE` - Suivi par numéro de série
