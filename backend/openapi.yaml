components:
  schemas:
    Action:
      type: object
      properties:
        action_id:
          type: string
          maxLength: 8
        action_libelle:
          type: string
          maxLength: 50
        action_description:
          type: string
      required:
      - action_description
      - action_id
      - action_libelle
    Article:
      type: object
      properties:
        code_article:
          type: string
          maxLength: 20
        code_barre:
          type: string
          nullable: true
          maxLength: 100
        designation:
          type: string
          maxLength: 50
        description:
          type: string
        modele:
          type: string
          maxLength: 30
        unite:
          type: string
          maxLength: 20
        seuil:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        mode_suivi:
          $ref: '#/components/schemas/ModeSuiviEnum'
        categorie:
          type: integer
        categorie_nom:
          type: string
          readOnly: true
        stock_calcule:
          type: integer
          readOnly: true
        is_immobilisation:
          type: boolean
          default: true
      required:
      - categorie
      - categorie_nom
      - code_article
      - designation
      - stock_calcule
    AttributionDetailCommande:
      type: object
      description: |-
        Ajoute les 4 champs d'écriture d'un bénéficiaire et leur résolution en Affectation.

        Utilisé par les serializers de mouvement, d'unité et d'attribution, qui
        déclaraient chacun les mêmes quatre champs et la même logique.
      properties:
        id:
          type: integer
          readOnly: true
        detail_commande:
          type: integer
          readOnly: true
        employe_beneficiaire:
          type: string
          writeOnly: true
          nullable: true
        direction_beneficiaire:
          type: string
          writeOnly: true
          nullable: true
        salle_beneficiaire:
          type: integer
          writeOnly: true
          nullable: true
        site_beneficiaire:
          type: integer
          writeOnly: true
          nullable: true
        beneficiaire_nom:
          type: string
          readOnly: true
        beneficiaire_type:
          type: string
          readOnly: true
        beneficiaire_id:
          type: string
          readOnly: true
        quantite:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quantite_demandee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Quantité demandée
        quantite_validee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Quantité validée
        statut:
          allOf:
          - $ref: '#/components/schemas/AttributionDetailCommandeStatutEnum'
          readOnly: true
        motif_refus:
          type: string
          readOnly: true
          nullable: true
          title: Motif de refus
        code_unique:
          type: string
          format: uuid
          readOnly: true
        date_acquisition:
          type: string
          format: date-time
          readOnly: true
        qr_code_data:
          type: string
          readOnly: true
      required:
      - beneficiaire_id
      - beneficiaire_nom
      - beneficiaire_type
      - code_unique
      - date_acquisition
      - detail_commande
      - id
      - motif_refus
      - qr_code_data
      - quantite
      - quantite_validee
      - statut
    AttributionDetailCommandeStatutEnum:
      enum:
      - EN_ATTENTE
      - VALIDEE
      - REFUSEE
      type: string
      description: |-
        * `EN_ATTENTE` - En attente
        * `VALIDEE` - Validée
        * `REFUSEE` - Refusée
    Autoriser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        autoriser_utilisateur_id:
          type: integer
        autoriser_action_id:
          type: string
      required:
      - autoriser_action_id
      - autoriser_utilisateur_id
      - id
    Categorie:
      type: object
      properties:
        categorie_id:
          type: integer
          readOnly: true
        cat_libelle:
          type: string
          maxLength: 20
        cat_description:
          type: string
      required:
      - cat_libelle
      - categorie_id
    Commande:
      type: object
      properties:
        commande_id:
          type: integer
          readOnly: true
        objet:
          type: string
          maxLength: 100
        statut:
          allOf:
          - $ref: '#/components/schemas/CommandeStatutEnum'
          readOnly: true
        date_commande:
          type: string
          format: date-time
          readOnly: true
        date_traitement:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        commentaire_agent:
          type: string
          readOnly: true
        employe_demandeur:
          type: string
        demandeur:
          type: string
          readOnly: true
        employe_traitant:
          type: string
          readOnly: true
          nullable: true
        traitant:
          type: string
          readOnly: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/DetailCommande'
      required:
      - commande_id
      - commentaire_agent
      - date_commande
      - date_traitement
      - demandeur
      - employe_traitant
      - statut
      - traitant
    CommandeStatutEnum:
      enum:
      - EN_ATTENTE
      - EN_COURS
      - VALIDEE
      - REJETEE
      type: string
      description: |-
        * `EN_ATTENTE` - En attente
        * `EN_COURS` - En cours
        * `VALIDEE` - Validée
        * `REJETEE` - Rejetée
    DetailCommande:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        commande:
          type: integer
          readOnly: true
        article:
          type: string
        article_designation:
          type: string
          readOnly: true
        quantite:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/AttributionDetailCommande'
      required:
      - article
      - article_designation
      - commande
      - id
      - quantite
    DetailMouvement:
      type: object
      description: |-
        Ajoute les 4 champs d'écriture d'un bénéficiaire et leur résolution en Affectation.

        Utilisé par les serializers de mouvement, d'unité et d'attribution, qui
        déclaraient chacun les mêmes quatre champs et la même logique.
      properties:
        id:
          type: integer
          readOnly: true
        employe_beneficiaire:
          type: string
          writeOnly: true
          nullable: true
        direction_beneficiaire:
          type: string
          writeOnly: true
          nullable: true
        salle_beneficiaire:
          type: integer
          writeOnly: true
          nullable: true
        site_beneficiaire:
          type: integer
          writeOnly: true
          nullable: true
        article_designation:
          type: string
          readOnly: true
        employe_beneficiaire_nom:
          type: string
          readOnly: true
        employe_beneficiaire_matricule:
          type: string
          readOnly: true
        employe_beneficiaire_fonction:
          type: string
          readOnly: true
        direction_beneficiaire_nom:
          type: string
          readOnly: true
        salle_beneficiaire_nom:
          type: string
          readOnly: true
        site_beneficiaire_nom:
          type: string
          readOnly: true
        beneficiaire_type:
          type: string
          readOnly: true
        fournisseur_nom:
          type: string
          readOnly: true
        qr_code_data:
          type: string
          readOnly: true
        unites_creees:
          type: array
          items:
            $ref: '#/components/schemas/UniteArticle'
          readOnly: true
        unites_attribuees:
          type: array
          items:
            $ref: '#/components/schemas/UniteArticle'
          readOnly: true
        numeros_de_serie:
          type: array
          items:
            type: string
            maxLength: 100
          writeOnly: true
        quantite:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        prix_achat:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        code_tracabilite:
          type: string
          readOnly: true
          nullable: true
        mouvement:
          type: integer
          readOnly: true
        article:
          type: string
        affectation:
          type: integer
          readOnly: true
          nullable: true
        fournisseur:
          type: integer
          nullable: true
      required:
      - affectation
      - article
      - article_designation
      - beneficiaire_type
      - code_tracabilite
      - direction_beneficiaire_nom
      - employe_beneficiaire_fonction
      - employe_beneficiaire_matricule
      - employe_beneficiaire_nom
      - fournisseur_nom
      - id
      - mouvement
      - qr_code_data
      - quantite
      - salle_beneficiaire_nom
      - site_beneficiaire_nom
      - unites_attribuees
      - unites_creees
    Direction:
      type: object
      properties:
        dir_id:
          type: string
          readOnly: true
