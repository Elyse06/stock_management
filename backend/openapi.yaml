components:
  schemas:
    Action:
      type: object
      properties:
        action_id:
          type: string
          maxLength: 8
        action_libelle:
          type: string
          maxLength: 50
        action_description:
          type: string
      required:
      - action_description
      - action_id
      - action_libelle
    Article:
      type: object
      properties:
        code_article:
          type: string
          maxLength: 20
        code_barre:
          type: string
          nullable: true
          maxLength: 100
        designation:
          type: string
          maxLength: 50
        description:
          type: string
        modele:
          type: string
          maxLength: 30
        unite:
          type: string
          maxLength: 20
        seuil:
          type: integer
          maximum: 2147483647
          minimum: 0
        mode_suivi:
          $ref: '#/components/schemas/ModeSuiviEnum'
        categorie:
          type: integer
        categorie_nom:
          type: string
          readOnly: true
        stock_calcule:
          type: integer
          readOnly: true
        is_immobilisation:
          type: boolean
          default: true
      required:
      - categorie
      - categorie_nom
      - code_article
      - designation
      - stock_calcule
    AttributionDetailCommande:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        detail_commande:
          type: integer
          readOnly: true
        employe_beneficiaire:
          type: string
          nullable: true
        direction_beneficiaire:
          type: string
          nullable: true
        site_beneficiaire:
          type: integer
          nullable: true
        beneficiaire_nom:
          type: string
          readOnly: true
        beneficiaire_type:
          type: string
          readOnly: true
        quantite:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quantite_demandee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Quantité demandée
        quantite_validee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Quantité validée
        statut:
          $ref: '#/components/schemas/AttributionDetailCommandeStatutEnum'
        motif_refus:
          type: string
          nullable: true
          title: Motif de refus
          maxLength: 255
        code_unique:
          type: string
          format: uuid
          readOnly: true
        date_acquisition:
          type: string
          format: date-time
          readOnly: true
        qr_code_data:
          type: string
          readOnly: true
      required:
      - beneficiaire_nom
      - beneficiaire_type
      - code_unique
      - date_acquisition
      - detail_commande
      - id
      - qr_code_data
      - quantite
    AttributionDetailCommandeStatutEnum:
      enum:
      - EN_ATTENTE
      - VALIDEE
      - REFUSEE
      type: string
      description: |-
        * `EN_ATTENTE` - En attente
        * `VALIDEE` - Validée
        * `REFUSEE` - Refusée
    Autoriser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        autoriser_utilisateur_id:
          type: integer
        autoriser_action_id:
          type: string
      required:
      - autoriser_action_id
      - autoriser_utilisateur_id
      - id
